services:
  postgres:
    image: postgres:16-alpine
    container_name: yinilow-postgres
    environment:
      POSTGRES_USER: yinilow
      POSTGRES_PASSWORD: yinilow
      POSTGRES_DB: yinilow
    ports:
      - "5432:5432"
    volumes:
      - yinilow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yinilow -d yinilow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yinilow-redis
    ports:
      - "6379:6379"
    volumes:
      - yinilow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  yinilow_pg_data:
  yinilow_redis_data:
